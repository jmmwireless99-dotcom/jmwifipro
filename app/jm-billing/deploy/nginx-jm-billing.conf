# JM billing panel — reverse proxy for jmwifi.pro + jmestre.tech (JM VPS)
# Install: copy to /etc/nginx/sites-available/jm-billing and enable, then certbot.
# DNS: A @ and www for both domains → 187.77.145.131

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jmwifi.pro www.jmwifi.pro jmestre.tech www.jmestre.tech 187.77.145.131 _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
