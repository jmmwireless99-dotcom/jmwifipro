<text x="582.4" y="100.2" font-size="6.0" fill="#333333" font-family="sans-serif">CHASSIS is the RJ45 shields and the mounting holes.</text>
<text x="5.6" y="195.4" font-size="6.0" fill="#333333" font-family="sans-serif">Power tree (sheets 02 and 03)</text>
<text x="5.6" y="202.2" font-size="6.0" fill="#333333" font-family="sans-serif">VIN_54V -&gt; TPS54560B -&gt; 5.0 V. PHY core bucks, DDR buck, SoC core buck. RT = 243k (400 kHz). FB = 53.6k / 10.2k.</text>
<text x="5.6" y="206.6" font-size="6.0" fill="#333333" font-family="sans-serif">VIN_54V -&gt; TPS54560B -&gt; 3.3 V. PHY I/O, SFP, flash, SoC I/O. FB = 31.6k / 10.0k.</text>
<text x="5.6" y="211.1" font-size="6.0" fill="#333333" font-family="sans-serif">VIN_54V -&gt; TPS54560B -&gt; 12 V fan. FB = 140k / 10.0k. Inductor 15 uH. COMP is copied from the 5 V example.</text>
<text x="5.6" y="215.6" font-size="6.0" fill="#333333" font-family="sans-serif">5 V -&gt; TPS54302 x8, one per RTL8221B, 0.95 V, enabled by that PHY POW_EXT_SWR pin.</text>
<text x="5.6" y="220.1" font-size="6.0" fill="#333333" font-family="sans-serif">5 V -&gt; TPS54302 DDR 1.5 V, then TPS51200 for VTT. 5 V -&gt; TPS54302 SoC core placeholder (confirm the Realtek voltage).</text>
<text x="5.6" y="224.6" font-size="6.0" fill="#333333" font-family="sans-serif">UVLO on the 54 V bucks starts near 48 V and stops near 44 V.</text>
</svg>