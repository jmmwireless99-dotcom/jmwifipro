<svg xmlns="http://www.w3.org/2000/svg" width="702" height="234" viewBox="0 0 702 234">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="5.6" y="5.6" font-size="7.2" fill="#1a1a1a" font-family="sans-serif">8x 2.5G PoE+ switch  +  4x 10G SFP+     reference schematic</text>
<text x="5.6" y="11.8" font-size="6.0" fill="#444444" font-family="sans-serif">Copper: RTL8221B-VB-CG (HiSGMII) x8.  PoE: TPS23881, 2-pair 802.3at, 30 W/port, 240 W budget.</text>
<text x="5.6" y="15.7" font-size="6.0" fill="#444444" font-family="sans-serif">Uplinks: SFP+ cages on switch SerDes (10GBASE-R).  Switch SoC: RTL9313-class functional symbol.</text>
<text x="5.6" y="19.6" font-size="6.0" fill="#444444" font-family="sans-serif">External supply: 54 VDC, 6 A minimum (about 320 W).  Logic ground = 54 V return (non-isolated).</text>
<text x="5.6" y="23.5" font-size="6.0" fill="#444444" font-family="sans-serif">NOT a fabrication file. Replace U_SW with the Realtek BGA symbol before any PCB.</text>
<text x="5.6" y="32.5" font-size="6.0" fill="#111111" font-family="sans-serif">54 V input, reverse polarity, fuse, TVS</text>
<text x="5.6" y="38.1" font-size="6.0" fill="#333333" font-family="sans-serif">P-MOS: source = fused input, drain = VIN_54V, gate pulled to GND. 12 V zener from gate to source. IRF9540N pins are 1=G, 2=D, 3=S.</text>
