# Active: jmwifi.pro serves billing/landing
# jmestre.tech → https://jmwifi.pro
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jmwifi.pro www.jmwifi.pro;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jmwifi.pro www.jmwifi.pro;
    ssl_certificate /etc/letsencrypt/live/jmwifi.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmwifi.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name jmestre.tech www.jmestre.tech;
    return 301 https://jmwifi.pro$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jmestre.tech www.jmestre.tech;
    ssl_certificate /etc/letsencrypt/live/jmwifi.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmwifi.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://jmwifi.pro$request_uri;
}
