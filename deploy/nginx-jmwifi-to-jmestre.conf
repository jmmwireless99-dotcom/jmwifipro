# jmwifi.pro → jmestre.tech (canonical)
# Install on Hostinger when jmestre.tech A points to this VPS (187.77.145.131).
server {
    listen 80;
    listen [::]:80;
    server_name jmwifi.pro www.jmwifi.pro;
    return 301 https://jmestre.tech$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jmwifi.pro www.jmwifi.pro;
    ssl_certificate /etc/letsencrypt/live/jmwifi.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmwifi.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://jmestre.tech$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jmestre.tech www.jmestre.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://jmestre.tech$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jmestre.tech www.jmestre.tech;
    ssl_certificate /etc/letsencrypt/live/jmestre.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmestre.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
