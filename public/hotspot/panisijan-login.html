<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>PANISIJAN · Free Internet</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;height:100%;font-family:Segoe UI,system-ui,sans-serif}
  body{
    min-height:100vh;
    background:#6b0f14 url('img/bg.jpg') center 38% / cover no-repeat fixed;
    display:flex;flex-direction:column;
  }
  .banner{
    width:100%;flex-shrink:0;padding:6px 6px 0;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));
    position:relative;z-index:2;
  }
  .banner img{
    display:block;width:100%;max-width:520px;margin:0 auto;height:auto;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.45));
  }
  .hero{flex:1 1 auto;min-height:42vh}
  .bottom{
    flex-shrink:0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.72) 35%,rgba(0,0,0,.88) 100%);
    position:relative;z-index:2;
  }
  .btn-register{
    display:block;width:100%;max-width:420px;margin:0 auto;
    padding:16px 14px;border:none;border-radius:12px;
    font-size:16px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;text-decoration:none;
    text-align:center;background:linear-gradient(120deg,#16a34a,#22c55e);color:#fff;cursor:pointer;
    box-shadow:0 10px 28px rgba(34,197,94,.35)
  }
  .btn-register:active{transform:scale(.98)}
  .btn-buy{
    display:block;width:100%;max-width:420px;margin:10px auto 0;
    padding:16px 14px;border:none;border-radius:12px;
    font-size:16px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;text-decoration:none;
    text-align:center;background:linear-gradient(120deg,#007dff,#00b4ff);color:#fff;cursor:pointer;
    box-shadow:0 10px 28px rgba(0,125,255,.35)
  }
  .btn-buy:active{transform:scale(.98)}
  .voucher-box{
    max-width:420px;margin:12px auto 0;padding:12px 14px;
    background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.28);border-radius:12px;
  }
  .voucher-box label{display:block;font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:6px;letter-spacing:.3px}
  .voucher-row{display:flex;gap:8px;align-items:stretch}
  .voucher-row input{
    flex:1;min-width:0;padding:12px 12px;border:1px solid rgba(148,163,184,.35);border-radius:10px;
    background:rgba(30,41,59,.95);color:#f8fafc;font-size:15px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;
  }
  .voucher-row input::placeholder{color:#64748b;font-weight:600;text-transform:none;letter-spacing:0}
  .btn-voucher{
    flex-shrink:0;padding:12px 16px;border:none;border-radius:10px;
    font-size:14px;font-weight:800;text-transform:uppercase;cursor:pointer;
    background:linear-gradient(120deg,#f59e0b,#fbbf24);color:#1f2937;
    box-shadow:0 8px 20px rgba(245,158,11,.28);
  }
  .btn-voucher:active{transform:scale(.98)}
  .voucher-hint{margin-top:8px;font-size:10px;color:#94a3b8;text-align:center;line-height:1.4}
  .foot{margin-top:12px;text-align:center;font-size:11px;color:#cbd5e1;line-height:1.5}
  .err{
    max-width:420px;margin:0 auto 12px;color:#fecaca;font-size:12px;padding:10px 12px;
    background:rgba(127,29,29,.55);border:1px solid rgba(248,113,113,.35);border-radius:10px;
  }
  .music-hint{
    max-width:420px;margin:0 auto 10px;text-align:center;font-size:10px;color:#94a3b8;line-height:1.4;
  }
</style>
<script src="https://jmwifi.pro/hotspot/portal-music.js"></script>
<script src="https://jmwifi.pro/hotspot/panisijan-autoconnect.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.PanisijanMusic) {
    PanisijanMusic.boot();
    PanisijanMusic.bindAutoStart();
    var btn = document.getElementById("registerBtn");
    if (btn) btn.addEventListener("click", function () { PanisijanMusic.start(); });
  }
});
</script>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
  <input type="hidden" name="username" value="">
  <input type="hidden" name="password" value="">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
</form>
<script src="/md5.js"></script>
<script>
function submitVoucher(){
  var form=document.login;
  var code=(form.username.value||"").trim().toUpperCase();
  if(!code){form.username.focus();return false;}
  form.username.value=code;
  if(window.PanisijanMusic&&PanisijanMusic.stop)PanisijanMusic.stop();
  try{sessionStorage.removeItem("kitifi_pending_voucher");}catch(e){}
  document.sendin.username.value=code;
  document.sendin.password.value=hexMD5('$(chap-id)'+code+'$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(else)
<script>
function submitVoucher(){
  var form=document.login;
  var code=(form.username.value||"").trim().toUpperCase();
  if(!code){form.username.focus();return false;}
  form.username.value=code;
  form.password.value=code;
  if(window.PanisijanMusic&&PanisijanMusic.stop)PanisijanMusic.stop();
  try{sessionStorage.removeItem("kitifi_pending_voucher");}catch(e){}
  return true;
}
</script>
$(endif)
</head>
<body>
  <div class="banner">
    <img src="img/banner.png" alt="PANISIJAN FREE INTERNET" onerror="this.onerror=null;this.src='img/logo.png';">
  </div>
  <div class="hero"></div>
  <div class="bottom">
    $(if error)<div class="err">$(error)</div>$(endif)
    <p class="music-hint">🎵 Music plays while you register · stops when connected</p>
    <a class="btn-register" id="registerBtn" href="https://jmwifi.pro/kitifi/free-internet?mac=$(mac)&amp;router_id=51&amp;return=$(link-login-only)">Register</a>
    <a class="btn-buy" id="buyBtn" href="https://jmwifi.pro/kitifi/generator-buy?mac=$(mac)&amp;router_id=51&amp;return=$(link-login-only)">Buy Voucher · GCash</a>
    <form class="voucher-box" name="login" action="$(link-login-only)" method="post" onsubmit="return submitVoucher();">
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">
      <input type="hidden" name="password" value="">
      <label for="voucherIn">May voucher code ka na?</label>
      <div class="voucher-row">
        <input type="text" name="username" id="voucherIn" placeholder="Ilagay ang voucher code" autocomplete="off" autocapitalize="characters" maxlength="32" inputmode="text">
        <button type="submit" class="btn-voucher">Connect</button>
      </div>
      <p class="voucher-hint">Parehong code ang username at password · GCash o free register</p>
    </form>
    <div class="foot">JM WiFi Network · Uson, Masbate</div>
  </div>
</body>
</html>
