<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales History — JM WIFI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --bg2: #161d26;
      --panel: #1a2330;
      --line: #2a3648;
      --ink: #e8eef6;
      --muted: #8b9bb0;
      --accent: #1d9e75;
      --accent2: #2ec4a0;
      --ok: #3ecf8e;
      --bad: #e85d6a;
      --radius: 12px;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --sans: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background:
        radial-gradient(900px 480px at 8% -10%, rgba(29, 158, 117, 0.14), transparent 55%),
        linear-gradient(180deg, #121820 0%, var(--bg) 45%);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.45;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 56px; }
    header.top {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
      align-items: flex-end; margin-bottom: 18px;
    }
    .brand { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent2); font-weight: 700; }
    h1 { font-size: clamp(1.4rem, 3vw, 1.85rem); font-weight: 700; margin-top: 4px; }
    .sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
    a.back {
      display: inline-block; text-decoration: none; color: var(--ink);
      border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
      padding: 8px 12px; font-size: 13px; font-weight: 600;
    }
    a.back:hover { border-color: var(--accent); color: var(--accent2); }

    .crumbs {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      margin-bottom: 14px; font-size: 13px; color: var(--muted);
    }
    .crumbs button {
      border: 0; background: transparent; color: var(--accent2); font: inherit;
      font-weight: 600; cursor: pointer; padding: 0;
    }
    .crumbs button:hover { text-decoration: underline; }
    .crumbs .here { color: var(--ink); font-weight: 700; }

    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,.28);
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(29,158,117,.14), transparent);
    }
    .panel-head h2 { font-size: 14px; font-weight: 700; }
    .panel-head .meta { font-size: 12px; color: var(--muted); font-weight: 500; }

    .list { list-style: none; }
    .list li { border-bottom: 1px solid var(--line); }
    .list li:last-child { border-bottom: 0; }
    .row {
      width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; background: transparent; border: 0; color: var(--ink);
      font: inherit; text-align: left; cursor: pointer;
    }
    .row:hover { background: rgba(46, 196, 160, 0.08); }
    .row .ico {
      width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
      background: #203042; border: 1px solid var(--line); flex: 0 0 34px; font-size: 15px;
    }
    .row .txt { flex: 1; min-width: 0; }
    .row .name { font-weight: 700; font-size: 14px; }
    .row .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .row .chev { color: var(--muted); font-size: 18px; }

    .plus {
      width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
      background: linear-gradient(135deg, #0d6b4a, #1d9e75); color: #fff;
      font-size: 26px; font-weight: 700; line-height: 1; box-shadow: 0 6px 18px rgba(29,158,117,.35);
    }
    .plus:hover { filter: brightness(1.08); }

    .vendo-card {
      padding: 12px 14px; border-bottom: 1px solid var(--line);
      display: grid; gap: 4px;
    }
    .vendo-card:last-child { border-bottom: 0; }
    .vendo-card .vn { font-weight: 700; font-size: 14px; }
    .vendo-card .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .vendo-card .amt { font-family: var(--mono); font-weight: 600; color: var(--ok); font-size: 14px; }
    .empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }

    /* Modal form */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(5, 10, 16, .72);
      display: none; align-items: flex-end; justify-content: center; z-index: 80;
      padding: 16px;
    }
    .modal-bg.open { display: flex; }
    @media (min-width: 640px) { .modal-bg { align-items: center; } }
    .modal {
      width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.45);
      animation: up .2s ease;
    }
    @keyframes up { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal h3 { font-size: 16px; margin-bottom: 4px; }
    .modal .where { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
    .fld { display: grid; gap: 5px; margin-bottom: 12px; }
    .fld label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    .fld input, .fld select {
      background: var(--bg2); border: 1px solid var(--line); color: var(--ink);
      border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 14px; width: 100%;
    }
    .fld input:focus, .fld select:focus { outline: 2px solid rgba(29,158,117,.45); border-color: var(--accent); }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .btn {
      border: 1px solid var(--line); background: var(--bg2); color: var(--ink);
      border-radius: 9px; padding: 10px 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn.primary { background: linear-gradient(135deg, #0d6b4a, #1d9e75); border-color: transparent; color: #fff; }
    .btn:hover { filter: brightness(1.05); }
    .err { color: var(--bad); font-size: 12.5px; min-height: 18px; margin-bottom: 6px; }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: #123528; border: 1px solid var(--accent); color: var(--ok);
      padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      display: none; z-index: 90;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="brand">JM WIFI NETWORK</div>
        <h1>Sales History</h1>
        <p class="sub">Municipal → Barangay → + Add vendo (name, month/date, sales)</p>
      </div>
      <a class="back" href="/operator">← Operator</a>
    </header>

    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 id="panel-title">Municipalities</h2>
          <div class="meta" id="panel-meta">Piliin ang municipality</div>
        </div>
        <button type="button" class="plus" id="btn-add" title="Add vendo" style="display:none" aria-label="Add vendo">+</button>
      </div>
      <div id="view"></div>
    </section>
  </div>

  <div class="modal-bg" id="modal-bg" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form class="modal" id="add-form">
      <h3 id="modal-title">Add vendo</h3>
      <div class="where" id="modal-where">—</div>
      <div class="err" id="form-err"></div>
      <div class="fld">
        <label for="f-vendo">Vendo name</label>
        <input id="f-vendo" name="vendo" required placeholder="e.g. Vendo Candelaria Plaza" autocomplete="off" />
      </div>
      <div class="fld">
        <label for="f-month">Month</label>
        <input id="f-month" name="month" type="month" required />
      </div>
      <div class="fld">
        <label for="f-date">Date (optional day)</label>
        <input id="f-date" name="date" type="date" />
      </div>
      <div class="fld">
        <label for="f-amount">Sales per vendo (₱)</label>
        <input id="f-amount" name="amount" type="number" min="0" step="1" required placeholder="0" />
      </div>
      <div class="actions">
        <button type="button" class="btn" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save vendo</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast">Saved</div>

  <script type="module">
    import { APPLY_COVERAGE } from "/lib/apply-coverage.mjs";

    const STORAGE_KEY = "jm_sales_history_vendos_v1";
    const state = {
      muni: null,
      brgy: null,
      entries: [],
    };

    const $ = (id) => document.getElementById(id);

    function peso(n) {
      return "₱" + Number(n || 0).toLocaleString("en-PH", { maximumFractionDigits: 0 });
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function saveLocal(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    async function loadEntries() {
      // Prefer server file; fall back to localStorage
      try {
        const r = await fetch("/api/sales-history", { credentials: "same-origin" });
        if (r.ok) {
          const d = await r.json();
          if (d && Array.isArray(d.entries)) {
            state.entries = d.entries;
            saveLocal(d.entries);
            return;
          }
        }
      } catch {}
      state.entries = loadLocal();
    }

    async function persistEntry(entry) {
      state.entries = [entry, ...state.entries];
      saveLocal(state.entries);
      try {
        await fetch("/api/sales-history", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(entry),
        });
      } catch {}
    }

    function entriesFor(muni, brgy) {
      return state.entries.filter(
        (e) =>
          String(e.municipality).toUpperCase() === muni &&
          String(e.barangay).toUpperCase() === brgy
      );
    }

    function countBrgy(muni) {
      return (APPLY_COVERAGE[muni] || []).length;
    }

    function countVendos(muni, brgy) {
      const set = new Set(entriesFor(muni, brgy).map((e) => e.vendo));
      return set.size;
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1800);
    }

    function renderCrumbs() {
      const el = $("crumbs");
      const parts = [];
      parts.push(`<button type="button" data-go="root">Municipalities</button>`);
      if (state.muni) {
        parts.push(`<span>›</span>`);
        if (state.brgy) {
          parts.push(`<button type="button" data-go="muni">${esc(state.muni)}</button>`);
          parts.push(`<span>›</span>`);
          parts.push(`<span class="here">${esc(state.brgy)}</span>`);
        } else {
          parts.push(`<span class="here">${esc(state.muni)}</span>`);
        }
      }
      el.innerHTML = parts.join(" ");
      el.querySelectorAll("button[data-go]").forEach((btn) => {
        btn.onclick = () => {
          if (btn.dataset.go === "root") {
            state.muni = null;
            state.brgy = null;
          } else if (btn.dataset.go === "muni") {
            state.brgy = null;
          }
          render();
        };
      });
    }

    function renderMunicipalities() {
      $("panel-title").textContent = "Municipalities";
      $("panel-meta").textContent = Object.keys(APPLY_COVERAGE).length + " municipalities · from jmwifi.pro/apply";
      $("btn-add").style.display = "none";
      const munis = Object.keys(APPLY_COVERAGE);
      $("view").innerHTML =
        `<ul class="list">` +
        munis
          .map((m) => {
            const n = countBrgy(m);
            return `<li>
              <button type="button" class="row" data-muni="${esc(m)}">
                <span class="ico">🏘</span>
                <span class="txt">
                  <div class="name">${esc(m)}</div>
                  <div class="desc">${n} barangay${n === 1 ? "" : "s"}</div>
                </span>
                <span class="chev">›</span>
              </button>
            </li>`;
          })
          .join("") +
        `</ul>`;
      $("view").querySelectorAll("[data-muni]").forEach((btn) => {
        btn.onclick = () => {
          state.muni = btn.dataset.muni;
          state.brgy = null;
          render();
        };
      });
    }

    function renderBarangays() {
      const list = APPLY_COVERAGE[state.muni] || [];
      $("panel-title").textContent = state.muni;
      $("panel-meta").textContent = list.length + " barangays · pindutin para mag-add ng vendo";
      $("btn-add").style.display = "none";
      $("view").innerHTML =
        `<ul class="list">` +
        list
          .map((b) => {
            const v = countVendos(state.muni, b);
            return `<li>
              <button type="button" class="row" data-brgy="${esc(b)}">
                <span class="ico">📍</span>
                <span class="txt">
                  <div class="name">${esc(b)}</div>
                  <div class="desc">${v} vendo${v === 1 ? "" : "s"} encoded</div>
                </span>
                <span class="chev">›</span>
              </button>
            </li>`;
          })
          .join("") +
        `</ul>`;
      $("view").querySelectorAll("[data-brgy]").forEach((btn) => {
        btn.onclick = () => {
          state.brgy = btn.dataset.brgy;
          render();
        };
      });
    }

    function renderBarangayDetail() {
      const rows = entriesFor(state.muni, state.brgy);
      $("panel-title").textContent = state.brgy;
      $("panel-meta").textContent = state.muni + " · " + rows.length + " sale row(s)";
      $("btn-add").style.display = "";

      if (!rows.length) {
        $("view").innerHTML = `<div class="empty">Wala pang vendo dito.<br>Pindutin ang <b>+</b> para mag-add.</div>`;
        return;
      }

      // Group by vendo name
      const byVendo = new Map();
      for (const r of rows) {
        const key = r.vendo || "(unnamed)";
        if (!byVendo.has(key)) byVendo.set(key, []);
        byVendo.get(key).push(r);
      }

      $("view").innerHTML = [...byVendo.entries()]
        .map(([name, list]) => {
          const total = list.reduce((n, x) => n + (Number(x.amount) || 0), 0);
          const months = [...new Set(list.map((x) => x.month || (x.date || "").slice(0, 7)))].filter(Boolean);
          return `<div class="vendo-card">
            <div class="vn">${esc(name)}</div>
            <div class="meta">${esc(months.join(", ") || "—")} · ${list.length} entry</div>
            <div class="amt">${peso(total)}</div>
          </div>`;
        })
        .join("");
    }

    function render() {
      renderCrumbs();
      if (!state.muni) renderMunicipalities();
      else if (!state.brgy) renderBarangays();
      else renderBarangayDetail();
    }

    function openForm() {
      $("form-err").textContent = "";
      $("modal-where").textContent = state.muni + " › " + state.brgy;
      const now = new Date();
      const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      const ymd = `${ym}-${String(now.getDate()).padStart(2, "0")}`;
      $("f-vendo").value = "";
      $("f-month").value = ym;
      $("f-date").value = ymd;
      $("f-amount").value = "";
      $("modal-bg").classList.add("open");
      setTimeout(() => $("f-vendo").focus(), 50);
    }

    function closeForm() {
      $("modal-bg").classList.remove("open");
    }

    $("btn-add").onclick = openForm;
    $("btn-cancel").onclick = closeForm;
    $("modal-bg").addEventListener("click", (e) => {
      if (e.target === $("modal-bg")) closeForm();
    });

    $("add-form").onsubmit = async (e) => {
      e.preventDefault();
      $("form-err").textContent = "";
      const vendo = $("f-vendo").value.trim();
      const month = $("f-month").value;
      let date = $("f-date").value;
      const amount = Number($("f-amount").value);
      if (!vendo) {
        $("form-err").textContent = "Lagyan ng vendo name.";
        return;
      }
      if (!month) {
        $("form-err").textContent = "Piliin ang month.";
        return;
      }
      if (!(amount >= 0)) {
        $("form-err").textContent = "Invalid sales amount.";
        return;
      }
      if (!date) date = month + "-01";
      // keep date inside selected month
      if (date.slice(0, 7) !== month) date = month + "-01";

      const entry = {
        id: "sh_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        municipality: state.muni,
        barangay: state.brgy,
        vendo,
        month,
        date,
        amount,
        createdAt: new Date().toISOString(),
      };
      await persistEntry(entry);
      closeForm();
      toast("Vendo saved");
      render();
    };

    await loadEntries();
    render();
  </script>
</body>
</html>
