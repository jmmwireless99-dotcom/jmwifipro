server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 100.101.1.71 192.168.200.155 112.209.31.253 jmvps _;

    client_max_body_size 50m;

    # CCTV HLS streams (MediaMTX)
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # MRP: VPN Clients · CCTV · Gasoline (frontend BASE=/cctv)
    location = /cctv {
        return 302 /cctv/;
    }
    location /cctv/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Legacy /billing → root (jmwifi dashboard is now the site root)
    location = /billing {
        return 302 /;
    }
    location /billing/ {
        return 302 /;
    }
    location = /hub {
        return 302 /;
    }
    location = /billing/hub {
        return 302 /;
    }

    # Main site = full jmwifi.pro billing dashboard
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
